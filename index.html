<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F1115">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Le tue carte Pokémon: collezione, valore e deck.">
  <link rel="icon" href="/deckflix/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/deckflix/icons/favicon-48.png" sizes="48x48" type="image/png">
  <link rel="apple-touch-icon" href="/deckflix/icons/apple-touch-icon.png">
  <link rel="manifest" href="/deckflix/manifest.webmanifest">
  <title>Deckflix</title>
</head>
<body>
  <!-- Loading screen: continues Android's splash (the ball alone) with the name below; the app
       removes it once ready. Inline styles: it shows before any CSS or script loads. -->
  <div id="splash" aria-hidden="true" style="position:fixed;inset:0;z-index:100;background:#0F1115;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .2s ease-out">
    <img src="/deckflix/icons/icon-192.png" alt="" width="112" height="112" style="display:block">
    <span style="font:800 30px/1 'Bricolage Grotesque',system-ui,sans-serif;letter-spacing:-.5px;color:#EEF0F4">Deck<span style="color:#FFCB45">flix</span></span>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
