name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fingerprint_minutes:
        description: Minuti per l'indice dei disegni (al massimo 300)
        default: '20'
  # Every morning (05:15 Italian winter time): fresh tournaments for the app.
  schedule:
    - cron: '15 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# A newer run waits for the one in progress instead of cancelling it: a long manual run of the
# fingerprint index would otherwise lose hours of work to a push or a late morning run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The build stamps the last commit's time, not now: the daily rebuild then produces the
      # same app, and phones don't get a "Nuova versione disponibile" every morning.
      - run: echo "BUILD_TIME=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      # Tournaments of the whole country from pokedata, next to the app. If pokedata is down
      # the app is published anyway and phones keep the tournaments they already have.
      - run: node scripts/fetch-tournaments.mjs dist
        continue-on-error: true
        env:
          TOURNAMENT_COUNTRIES: ${{ vars.TOURNAMENT_COUNTRIES || 'IT' }}
      # Drawing fingerprints of all cards, for the scanner. Built slowly over the morning runs
      # (20 minutes each, under two thumbnails a second; a manual run can last longer), then only new cards are added; a push
      # just republishes the index already online.
      - run: node scripts/fingerprints.mjs dist
        continue-on-error: true
        env:
          FINGERPRINT_MINUTES: ${{ github.event_name == 'push' && '0' || inputs.fingerprint_minutes || '20' }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # GitHub turns off scheduled workflows after 60 days without commits; re-enabling it every
  # day keeps the morning tournaments coming.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
