<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Caricamento</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{font-family:inherit}
a{color:#FFCB45}a:hover{color:#FFE08A}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-5px) rotate(-4deg)}}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
.bob{animation:bob 3.4s ease-in-out infinite;transform-origin:50% 80%}
.pop{animation:pop 2.4s ease-in-out infinite;transform-origin:50% 60%}
@media (prefers-reduced-motion: reduce){.bob,.pop{animation:none}}
@keyframes fill{0%{height:0%}100%{height:100%}}
.fill{animation:fill 2.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.fill{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F1115; color: #EEF0F4; font-family: 'DM Sans', system-ui, sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column">
<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px">
<div style="position: relative; width: 140px; height: 140px; border-radius: 50%; overflow: hidden; background: #232733">
<span class="fill" style="position: absolute; left: 0; right: 0; bottom: 0; height: 64%; background: {{accent}}"></span>
<span style="position: absolute; inset: 0; border-radius: 50%; border: 2px dashed rgba(255,255,255,0.35); display: flex; align-items: center; justify-content: center; text-align: center; font-size: 11px; font-weight: 600; color: #EEF0F4; padding: 0 18px; line-height: 1.3">la tua Pokéball<br>(SVG)</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -0.5px">Deck<span style="color: {{accent}}">flix</span></span>
<span style="font-size: 13px; color: #9AA1AE">Caricamento della collezione… 64%</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFCB45","options":["#FFCB45","#5AA9FF","#FF7A6B","#5BD08A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FFCB45' };
  }
}
</script>
</body>
</html>
